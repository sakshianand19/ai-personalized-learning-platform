<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LearnPath AI – Personalized Learning</title>
  <meta name="description" content="AI-Powered Personalized Learning Platform built with FastAPI, Azure OpenAI and LangChain.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b47f5'/><path d='M9 21l5-10 4 7 2-3 3 6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=3">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M9 21l5-10 4 7 2-3 3 6" /></svg>
        </span>
        <span class="brand-text">LearnPath <b>AI</b></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="role-note" id="role-note"></div>
        <div class="engine" id="engine" title="AI engine powering content analysis and question review">
          <span class="dot"></span><span id="engine-label">Checking AI engine…</span>
        </div>
        <a class="foot-link" href="/docs" target="_blank" rel="noopener">API docs ↗</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-actions">
          <div class="role-switch" id="role-switch" role="tablist" aria-label="View as"></div>
          <label class="student-picker">
            <span class="avatar" id="avatar">?</span>
            <select id="person-select" aria-label="Current user"></select>
          </label>
          <button class="btn ghost icon-only" id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
